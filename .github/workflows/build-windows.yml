name: Build Windows .exe

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'   # no code-signing certificate
      PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Privacy scan
        run: npm run privacy

      - name: Run tests
        run: npm test

      - name: Build portable .exe
        run: npx electron-builder --win portable --x64 --publish never

      - name: Upload .exe
        uses: actions/upload-artifact@v4
        with:
          name: CSD-Receipt-windows
          path: dist/*.exe
          if-no-files-found: error

      - name: Attach .exe to release (tags only)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.exe
